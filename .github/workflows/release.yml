name: Build & Release

# PRs validate the project and upload installers as workflow artifacts.
# Pushes to main publish/update a GitHub Release when signing secrets exist.
# Tags v* remain supported for manually versioned releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SCHEME: Termac
  APP_NAME: Termac.app
  IDENTITY: Termac Self-Signed
  EXPECTED_FINGERPRINT: "BD3410131BF1D658CD0E82C6585C0AB1EC30C9C8F826C985614C582514C5EED4"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Selecionar Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16*.app || true

      - name: Importar identidade de assinatura
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "ci-keychain-pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci-keychain-pass" build.keychain

          if [[ -n "${SIGNING_P12_BASE64:-}" && -n "${SIGNING_P12_PASSWORD:-}" ]]; then
            echo "$SIGNING_P12_BASE64" | base64 --decode > termac.p12
            security import termac.p12 -k build.keychain \
              -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: \
              -s -k "ci-keychain-pass" build.keychain >/dev/null

            ACTUAL="$(security find-certificate -c "$IDENTITY" -p \
              | openssl x509 -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':')"
            if [[ "$ACTUAL" != "$EXPECTED_FINGERPRINT" ]]; then
              echo "::error::Fingerprint da identidade difere do esperado ($ACTUAL)"
              exit 1
            fi
            echo "Identidade importada e fingerprint verificado."
            echo "RELEASE_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets de assinatura ausentes — usando identidade descartável; este run não publica release."
            TMP="$(mktemp -d)"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -keyout "$TMP/key.pem" -out "$TMP/cert.pem" \
              -subj "/CN=$IDENTITY" \
              -addext "basicConstraints=critical,CA:false" \
              -addext "keyUsage=critical,digitalSignature" \
              -addext "extendedKeyUsage=critical,codeSigning" 2>/dev/null
            openssl pkcs12 -export -inkey "$TMP/key.pem" -in "$TMP/cert.pem" \
              -name "$IDENTITY" -out "$TMP/termac.p12" -passout "pass:ci" \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 2>/dev/null
            security import "$TMP/termac.p12" -k build.keychain \
              -P "ci" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: \
              -s -k "ci-keychain-pass" build.keychain >/dev/null
            rm -rf "$TMP"
          fi

      - name: Rodar testes
        run: xcodebuild -project Termac.xcodeproj -scheme "$SCHEME" \
          -destination 'platform=macOS' test -quiet

      - name: Build Release + DMG assinado
        run: ./Script/make-dmg.sh

      - name: Empacotar ZIP do app e ler versão
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            build-dmg-derived/Build/Products/Release/Termac.app/Contents/Info.plist)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent \
            "build-dmg-derived/Build/Products/Release/Termac.app" "Termac-macos.zip"

      - name: Conferir versão x tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != MARKETING_VERSION ${VERSION}."
            exit 1
          fi

      - name: Gerar checksums
        run: |
          shasum -a 256 "dist/Termac-${VERSION}.dmg" Termac-macos.zip \
            > "Termac-${VERSION}-checksums.txt"

      - name: Upload dos instaladores (todo run)
        uses: actions/upload-artifact@v4
        with:
          name: Termac-installers
          path: |
            dist/Termac-${{ env.VERSION }}.dmg
            Termac-macos.zip
            Termac-${{ env.VERSION }}-checksums.txt
          if-no-files-found: error

      - name: Publicar GitHub Release (main ou tag)
        if: env.RELEASE_READY == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v${VERSION}"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/Termac-${VERSION}.dmg" Termac-macos.zip \
              "Termac-${VERSION}-checksums.txt" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/Termac-${VERSION}.dmg" Termac-macos.zip \
              "Termac-${VERSION}-checksums.txt" \
              --title "Termac ${VERSION}" \
              --generate-notes
          fi

      - name: Bump do tap Homebrew (release publicada)
        if: env.RELEASE_READY == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN ausente — pulando bump do cask."
            exit 0
          fi

          SHA="$(shasum -a 256 Termac-macos.zip | awk '{print $1}')"
          API="repos/ThiagoAciole/homebrew-termac/contents/Casks/termac.rb"
          AUTH="Authorization: Bearer $HOMEBREW_TAP_TOKEN"

          if ! gh api -H "$AUTH" "repos/ThiagoAciole/homebrew-termac" >/dev/null 2>&1; then
            echo "::warning::Tap inacessível — pulando bump do cask."
            exit 0
          fi

          gh api -H "$AUTH" "$API" > cask-meta.json
          BLOB_SHA="$(jq -r .sha cask-meta.json)"
          jq -r .content cask-meta.json | base64 --decode > cask.rb
          sed -E -i '' \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "s/sha256 \".*\"/sha256 \"${SHA}\"/" \
            cask.rb

          CONTENT="$(base64 -i cask.rb)"
          gh api -X PUT -H "$AUTH" "$API" \
            -f message="bump termac ${VERSION}" \
            -f content="$CONTENT" \
            -f sha="$BLOB_SHA" >/dev/null
          echo "Cask atualizado: version ${VERSION}, sha256 ${SHA}"
